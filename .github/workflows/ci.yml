name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - run: npm ci
      - run: npm run build
      # Fully hermetic — blanks all secret env vars before running, so no
      # OPENROUTER_API_KEY/AZURE_*/BRAVE_SEARCH_API_KEY secrets are needed here.
      - run: npm test
